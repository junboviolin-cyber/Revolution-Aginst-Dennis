<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-YwMelx9EcqH4UmxhD32ubz55t0YtPk0UNzWQRcQ+Ers='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a33'/%3E%3Cpath d='M32 10l6.5 14.5 15.5 1.5-11.7 10.4 3.4 15.4L32 43.5 18.3 51.8l3.4-15.4L10 26l15.5-1.5z' fill='%23e6bd5c'/%3E%3C/svg%3E">
<title>Locked</title>
<style>
  :root{
    --ink:#0e1522; --ink-2:#17213a; --text:#eef1f6; --muted:#8f9bb3;
    --line:#2b3857; --brass:#d9b25a; --danger:#ff6b5e; --ok:#7fd6a0; --red:#d8332a; --red-dark:#8f1d17;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;color:var(--text);
    font-family:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 28%,var(--ink-2) 0%,var(--ink) 62%) fixed;
  }
  [hidden]{display:none!important}
  .screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
  main{width:100%;max-width:320px;padding:24px;text-align:center}

  /* ---------- lock screen ---------- */
  .lock{width:168px;height:210px;margin:0 auto 18px;display:block;overflow:visible}
  #shackle{transform-origin:116px 92px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
  .open #shackle{transform:translateY(-12px) rotate(32deg)}
  #keyhole{transition:fill .3s}
  #glow{opacity:.55;transition:opacity .4s}
  .open #glow{opacity:1}
  .bad #keyhole{fill:var(--danger)}
  .open #keyhole{fill:var(--ok)}
  .lockwrap.shake{animation:shake .38s}
  @keyframes shake{20%{transform:translateX(-9px) rotate(-2deg)}50%{transform:translateX(8px) rotate(2deg)}80%{transform:translateX(-4px)}}
  h1{font-size:26px;font-weight:600;letter-spacing:.01em;margin:0 0 6px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:15px}
  .field{position:relative;margin-bottom:12px}
  input{width:100%;padding:13px 46px 13px 16px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--text);font-size:16px;letter-spacing:.04em}
  input::placeholder{color:var(--muted);letter-spacing:0}
  input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;
    background:none;color:var(--muted);cursor:pointer;border-radius:8px;padding:0}
  .eye:hover{color:var(--text)}
  .eye:focus-visible,.go:focus-visible,.relock:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .go{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#2a1d08;
    background:linear-gradient(180deg,#ecca78,var(--brass) 55%,#c39a40);
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 18px rgba(217,178,90,.22)}
  .go:hover{filter:brightness(1.06)}.go:active{transform:translateY(1px)}
  .err{min-height:20px;margin-top:12px;font-size:14px;color:var(--danger)}
  .ok .err{color:var(--ok)}

  /* ---------- inside ---------- */
  #inside{animation:enter .8s ease both}
  @keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .wrap{max-width:880px;margin:0 auto;padding:0 24px}
  .hero{position:relative;overflow:hidden;padding:84px 0 72px;border-bottom:4px solid var(--brass)}
  .hero::before{content:"";position:absolute;top:-40%;bottom:-40%;left:-12%;width:58%;
    background:linear-gradient(180deg,var(--red),var(--red-dark));transform:rotate(14deg);transform-origin:center}
  .hero .wrap{position:relative}
  .welcome{margin:0 0 10px;font-size:18px;font-weight:600;color:#ffe9d6}
  .display{margin:0;font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;font-weight:400;
    font-size:clamp(46px,9.5vw,92px);line-height:.98;text-transform:uppercase;letter-spacing:.01em}
  .abbr{display:inline-block;margin-top:22px;padding:6px 18px;border:3px solid var(--brass);color:var(--brass);
    font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;font-size:34px;letter-spacing:.18em;
    background:rgba(14,21,34,.7);transform:rotate(-3deg)}
  .lead{max-width:520px;margin:26px 0 0;font-size:18px;line-height:1.55;color:var(--text)}

  section{padding:56px 0 0}
  h2{margin:0 0 18px;font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;font-weight:400;
    font-size:30px;letter-spacing:.02em}
  .manifesto{font-size:clamp(22px,3.4vw,30px);line-height:1.4;max-width:720px;margin:0}
  .manifesto b{color:var(--brass);font-weight:600}
  ol.rules{margin:0;padding:0;list-style:none;counter-reset:r}
  ol.rules li{counter-increment:r;display:flex;gap:18px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line);font-size:18px}
  ol.rules li:last-child{border-bottom:1px solid var(--line)}
  ol.rules li::before{content:counter(r);flex:none;width:34px;font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:26px;color:var(--red)}
  dl.ranks{margin:0;max-width:640px}
  dl.ranks div{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid var(--line)}
  dl.ranks div:last-child{border-bottom:1px solid var(--line)}
  dt{font-weight:600;font-size:18px;color:var(--brass)}
  dd{margin:0;color:var(--muted);text-align:right}
  footer{padding:64px 0 56px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
  .relock{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);
    font-size:15px;font-weight:600;cursor:pointer}
  .relock:hover{border-color:var(--brass)}

  ul.members{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 32px;max-width:640px;border-bottom:1px solid var(--line)}
  ul.members li{flex:1 1 40%;padding:13px 0;border-top:1px solid var(--line);font-size:18px}
  .hint{display:block;margin-top:4px}
  input:disabled,.go:disabled{opacity:.5;cursor:not-allowed}
  /* weak-flashlight cursor glow */
  #torch{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;
    pointer-events:none;z-index:99999;opacity:0;mix-blend-mode:screen;will-change:transform;
    background:radial-gradient(circle,rgba(255,196,120,.22) 0%,rgba(255,176,96,.10) 26%,rgba(255,160,80,.035) 46%,transparent 66%)}
  #torch.on{opacity:1;animation:weak 3.4s infinite}
  @keyframes weak{
    0%{filter:brightness(1)}8%{filter:brightness(.72)}11%{filter:brightness(1)}
    37%{filter:brightness(.9)}40%{filter:brightness(.55)}43%{filter:brightness(.95)}
    71%{filter:brightness(1)}74%{filter:brightness(.68)}78%{filter:brightness(1.05)}100%{filter:brightness(1)}}
  @media (hover:none){#torch{display:none}}
  .caps{margin:-2px 0 12px;font-size:13px;font-weight:600;color:#f2c14e}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .slock{width:120px;height:150px;margin:0 auto 14px;display:block;overflow:visible}
  #sshackle{transform-origin:116px 92px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
  .sopen #sshackle{transform:translateY(-12px) rotate(32deg)}
  #skeyhole{transition:fill .3s}
  .sbad #skeyhole{fill:var(--danger)}
  .sopen #skeyhole{fill:var(--ok)}
  .sopen .err{color:var(--ok)}
  .backbtn{width:100%;margin-top:10px}
  #page{animation:enter .8s ease both}
  .topbar{position:relative;z-index:2;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:880px;margin:0 auto;padding:16px 24px}
  .places{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:16px}
  .place{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;padding:24px 22px;border:2px solid var(--brass);
    border-radius:14px;background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;text-align:left;font:inherit}
  .place:hover{background:rgba(217,178,90,.1);transform:translateY(-2px)}
  .place:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  .place svg{width:26px;height:26px;fill:none;stroke:var(--brass);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .pname{font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;font-size:32px;letter-spacing:.02em}
  .pnote{color:var(--muted);font-size:14px}
  .place.home{flex-direction:row;align-items:center;gap:14px;border-color:var(--red)}
  .place.home svg{stroke:var(--red)}
  .place.home .pnote{margin-left:auto}
  ul.ranklist{list-style:none;margin:0;padding:0;max-width:640px;border-bottom:1px solid var(--line)}
  ul.ranklist li{display:flex;align-items:center;gap:20px;padding:12px 0;border-top:1px solid var(--line)}
  .rmedal{flex:none;width:50px;height:88px;display:block}
  .rtext{display:flex;flex-direction:column;gap:2px}
  .rname{font-weight:600;font-size:20px;color:var(--brass)}
  .rdesc{color:var(--muted);font-size:15px}
  .chat{max-width:640px}
  .chatlog{height:300px;overflow-y:auto;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
  .chatempty{color:var(--muted);text-align:center;margin-top:110px;font-size:15px}
  .msg{max-width:82%;margin:0 0 10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);word-wrap:break-word;overflow-wrap:anywhere}
  .msg.me{margin-left:auto;background:rgba(217,178,90,.2)}
  .msg b{display:block;font-size:12px;color:var(--brass);margin-bottom:2px}
  .msg time{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .chatsend{display:flex;gap:10px;margin-top:12px}
  .chatsend input{flex:1;padding-right:16px;letter-spacing:0}
  .chatsend .go{width:auto;padding:12px 24px}
  .chatnote{margin:10px 0 0;font-size:13px;color:var(--muted)}
  .relock:disabled{opacity:.45;cursor:not-allowed}
  .chatwho{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:15px}
  .chatwho #chatas{margin-right:auto;font-weight:600;color:var(--muted)}
  .chatwho .relock{padding:8px 14px;font-size:14px}
  .chatwho .relock.active{border-color:var(--brass);color:var(--brass)}
  .chatauth{margin-bottom:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
  .chatauth label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
  .chatauthrow{display:flex;gap:10px;flex-wrap:wrap}
  .chatauthrow input{flex:1;min-width:140px;padding-right:16px;letter-spacing:.04em}
  .chatauthrow .go{width:auto;padding:10px 20px}
  .chatauthrow .relock{padding:10px 16px}
  .chatauth .err{margin-top:8px;min-height:18px}
  .msgdel{display:block;margin-top:4px;padding:0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
  .msgdel:hover{color:var(--danger)}
  /* ===== v2: calmer palette, background, top bar, cards ===== */
  :root{--ink:#070b14;--ink-2:#101a33;--text:#eef2fa;--muted:#93a0bb;--line:rgba(255,255,255,.11);--brass:#e6bd5c;--red:#5b7cfa;--red-dark:#27388f}
  body{background:radial-gradient(ellipse at 50% 18%,#15244d 0%,var(--ink-2) 42%,var(--ink) 82%) fixed}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .screen,#inside,#page{position:relative;z-index:1}
  #inside,#page,#subLock{padding-top:56px}
  #bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 18px;
    background:rgba(7,11,20,.74);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-family:Impact,"Arial Narrow Bold",sans-serif;letter-spacing:.12em;color:var(--brass)}
  .brand svg{width:18px;height:18px;fill:var(--brass)}
  .crumb{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1}
  .pill{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill.warn{background:var(--brass);border-color:var(--brass);color:#2a1d08;font-weight:700}
  .barbtn{padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
  .barbtn:hover{border-color:var(--brass)}
  .fab{position:fixed;right:16px;bottom:16px;z-index:60;padding:9px 14px;border-radius:999px;border:1px solid var(--line);
    background:rgba(7,11,20,.72);color:var(--muted);font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
  .fab:hover{color:var(--text);border-color:var(--brass)}
  .avatar{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--a,var(--brass));
    color:#07101c;font:800 16px Arial,sans-serif;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .avatar.sm{width:30px;height:30px;font-size:12px}.avatar.xl{width:88px;height:88px;font-size:32px}
  .hero::before{background:linear-gradient(180deg,var(--accent,var(--red)),var(--accent-dark,var(--red-dark)));opacity:.92}
  .hero{border-bottom-color:var(--accent,var(--brass))}
  .herorow{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  ol.rules li::before{color:var(--accent,var(--brass))}
  .places{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .place{--c:var(--brass);gap:10px;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));transition:transform .2s,box-shadow .2s}
  .place:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.38)}
  .place svg{stroke:var(--c)}
  .place.out{opacity:.7}.place.out .pnote{color:var(--danger)}
  .place.home{border-color:var(--line);border-top-color:var(--brass);--c:var(--brass)}
  .place.home svg{stroke:var(--brass)}
  ul.members li{display:flex;align-items:center;gap:14px}
  ul.ranklist{max-width:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;border:0}
  ul.ranklist li{flex-direction:column;text-align:center;gap:10px;padding:18px 10px;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.04);transition:transform .2s}
  ul.ranklist li:hover{transform:translateY(-5px)}
  .rmedal{width:62px;height:108px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
  .rtext{align-items:center}
  .msg{display:flex;align-items:flex-end;gap:10px;max-width:90%;padding:0;background:none}
  .msg.me{flex-direction:row-reverse;margin-left:auto;background:none}
  .bub{padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.08);min-width:0}
  .msg.me .bub{background:rgba(230,189,92,.2)}
  .ladder{display:flex;gap:16px;flex-wrap:wrap}
  .ladder figure{margin:0;text-align:center;font-size:13px;color:var(--muted)}
  .ladder .rmedal{width:56px;height:98px;display:block;margin:0 auto 4px}
  .ladder .off{opacity:.2;filter:grayscale(1)}
  #notes{width:100%;min-height:150px;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--text);font:inherit;line-height:1.5;resize:vertical;letter-spacing:0}
  #notes:focus{outline:2px solid var(--accent,var(--brass));outline-offset:1px}
  #subapp{--accent:var(--brass)}
  #subapp .go{background:linear-gradient(180deg,var(--accent),var(--accent));filter:none}
  #subapp input:focus{outline-color:var(--accent)}
  .lock{transition:transform .15s ease-out;will-change:transform}
  /* v3: no text highlighting, popping glow, founder card */
  body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  input,textarea{-webkit-user-select:text;user-select:text}
  #torch.on.pop{animation:pop .5s ease-out}
  @keyframes pop{0%{scale:1;filter:brightness(1)}30%{scale:1.55;filter:brightness(3)}100%{scale:1;filter:brightness(1)}}
  .founderbox{display:flex;align-items:center;gap:24px;flex-wrap:wrap;max-width:640px;padding:22px;border:1px solid var(--brass);
    border-radius:16px;background:linear-gradient(135deg,rgba(230,189,92,.14),rgba(255,255,255,.02))}
  .founderbox .rmedal{width:84px;height:148px}
  .fname{margin:0 0 6px;font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;font-size:32px;letter-spacing:.03em;color:var(--brass)}
  .fdesc{margin:0;max-width:380px;line-height:1.5;color:var(--muted)}
  footer .actions{gap:12px}
  @media (prefers-reduced-motion:reduce){#torch.on.pop{animation:none}}
  .scenemenu{position:fixed;right:16px;bottom:62px;z-index:61;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;
    border:1px solid var(--line);border-radius:14px;background:rgba(7,11,20,.9);backdrop-filter:blur(10px)}
  .scenemenu button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);
    font-size:13px;cursor:pointer;text-align:left}
  .scenemenu button:hover{color:var(--text)}
  .scenemenu button.on{border-color:var(--brass);color:var(--brass)}
  /* playground */
  .pg{max-width:880px}
  .pgcanvas{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#080d1a}
  #pgc{display:block;width:100%;touch-action:none;cursor:crosshair}
  .pgstats{position:absolute;left:10px;top:10px;font-size:13px;color:var(--text);background:rgba(7,11,20,.7);padding:5px 12px;border-radius:999px;pointer-events:none}
  .pgtop{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .pgpanel{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
  .pggroup{border:1px solid var(--line);border-radius:14px;padding:16px;background:rgba(255,255,255,.03)}
  .pgtitle{margin:0 0 10px;font-family:Impact,"Arial Narrow Bold",sans-serif;font-weight:400;font-size:20px;letter-spacing:.03em;color:var(--brass)}
  .pgname{font-size:13px;color:var(--muted)}
  .pgrow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .pgrow .pgname{width:76px;flex:none}
  .pgrow input{flex:1;width:auto;padding:0;border:0;background:none;accent-color:var(--brass);height:20px;letter-spacing:0}
  .pgval{width:64px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
  .pgbtns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .pgb{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-size:13px;cursor:pointer}
  .pgb:hover{color:var(--text)}.pgb.on{border-color:var(--brass);color:var(--brass)}
  .pgb.big{color:var(--text);font-weight:600}
  /* v5: lock polish, settings panel */
  .kicker{margin:0 0 6px;font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:15px;letter-spacing:.5em;text-indent:.5em;color:var(--brass);opacity:.85}
  .lockwrap{position:relative;width:168px;margin:0 auto 18px}
  .lockwrap::before{content:"";position:absolute;left:50%;top:52%;width:244px;height:244px;margin:-122px 0 0 -122px;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 0deg,transparent 0 55%,rgba(230,189,92,.75) 80%,transparent 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
    animation:ringspin 7s linear infinite;transition:opacity .5s,transform .7s}
  @keyframes ringspin{to{transform:rotate(360deg)}}
  .open .lockwrap::before,.sopen .lockwrap::before{opacity:0;transform:scale(1.6)}
  .bad .lockwrap::before,.sbad .lockwrap::before{background:conic-gradient(from 0deg,rgba(255,107,94,.8),transparent 60%,rgba(255,107,94,.8))}
  #slockwrap{width:120px}#slockwrap::before{width:176px;height:176px;margin:-88px 0 0 -88px}
  #app #glow{opacity:calc(.35 + var(--k,0) * .65)}#app.open #glow{opacity:1}
  .pips{display:flex;justify-content:center;gap:8px;margin-top:14px}
  .pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .3s,transform .3s}
  .pips i.used{background:var(--danger);transform:scale(1.15)}
  .scenemenu{display:block;width:290px;max-height:78vh;overflow:auto;grid-template-columns:none}
  .smh{margin:4px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .smgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .smrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
  .smname{width:54px;flex:none;color:var(--muted)}
  .smrow input{flex:1;width:auto;padding:0;border:0;background:none;accent-color:var(--brass);height:20px;letter-spacing:0}
  .smval{width:48px;text-align:right;font-variant-numeric:tabular-nums}
  .scenemenu .smtoggle{width:100%;margin-top:6px;text-align:center}
  .notorch #torch{display:none}
  .emojirow{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
  .emo{padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:16px;cursor:pointer}
  .emo:hover{border-color:var(--brass)}
  /* v6: person dashboard */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;max-width:90vw;padding:12px 20px;border-radius:999px;
    background:var(--brass);color:#2a1d08;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:enter .4s ease both}
  .avring{position:relative;width:128px;height:128px;flex:none}
  .ringsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .rtrack{fill:none;stroke:rgba(255,255,255,.14);stroke-width:5}
  .rfill{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1s ease;filter:drop-shadow(0 0 6px var(--accent))}
  .avring .avatar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;font-size:34px;background:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{padding:5px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(7,11,20,.62);font-size:13px;font-weight:600}
  .statusin{display:block;margin-top:12px;width:min(340px,100%);padding:9px 14px;letter-spacing:0;font-size:14px;background:rgba(7,11,20,.55)}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .statcard{padding:18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
  .sv{font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:36px;color:var(--accent);line-height:1.1}
  .sl{margin-top:4px;font-size:13px;color:var(--muted)}
  .nextlabel{margin:20px 0 10px;font-size:15px}
  .bar{height:14px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--brass));transition:width .9s ease}
  ul.quests,ul.actlog{list-style:none;margin:0;padding:0;max-width:640px}
  ul.quests li{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);font-size:17px}
  ul.quests li:last-child{border-bottom:1px solid var(--line)}
  .chk{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-weight:800;color:#07101c}
  ul.quests li.done .chk{background:var(--accent);border-color:var(--accent)}
  ul.quests li.done .qname{color:var(--muted);text-decoration:line-through}
  .qxp{margin-left:auto;color:var(--brass);font-weight:700;font-size:14px}
  .ladder figcaption small{display:block;font-size:11px;margin-top:2px}
  .howto{margin-top:20px;max-width:640px;border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:rgba(255,255,255,.03)}
  .howto summary{cursor:pointer;font-weight:700;color:var(--brass)}
  .howto ul{margin:12px 0 0;padding-left:20px;line-height:1.6;color:var(--muted)}
  .thresh{margin:12px 0 0;font-size:13px;color:var(--text)}
  .achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .ach{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);opacity:.5;font-size:14px}
  .ach span{color:var(--muted);font-size:13px}
  .ach.on{opacity:1;border-color:var(--accent);background:rgba(255,255,255,.07)}
  .ach.on b{color:var(--accent)}
  ul.actlog li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  ul.actlog li b{color:var(--brass);white-space:nowrap}
  ul.actlog li.empty{color:var(--muted);display:block}
  .swatches{display:flex;gap:12px;flex-wrap:wrap}
  .swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s}
  .swatch:hover{transform:scale(1.12)}.swatch.on{border-color:#fff}
  @media (prefers-reduced-motion:reduce){.rfill,.bar i{transition:none}.toast{animation:none}}
  /* v7: crew, leaderboard, members, chat days */
  ol.board{list-style:none;margin:0;padding:0;max-width:720px}
  ol.board li{display:grid;grid-template-columns:28px 30px minmax(90px,1.2fr) 80px minmax(60px,2fr) 70px;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  ol.board li:last-child{border-bottom:1px solid var(--line)}
  ol.board li:first-child .pos{color:var(--brass)}
  .pos{font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:22px;color:var(--muted);text-align:center}
  .bname{font-weight:600}.brank{font-size:13px;color:var(--muted)}
  .bbar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .bbar i{display:block;height:100%;border-radius:999px;transition:width .8s ease}
  ol.board li b{text-align:right;color:var(--brass);font-size:14px;white-space:nowrap}
  .mcol{display:flex;flex-direction:column;min-width:0}.mname{font-weight:600}
  .mmeta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chatday{align-self:center;text-align:center;margin:10px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  /* v8: settings, game extras, rank text */
  .rdesc{max-width:150px;line-height:1.35}
  .rxp{margin-top:4px;font-size:12px;color:var(--brass);font-weight:700}
  .placerow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .placerow .place{width:100%}
  .pgstop{position:absolute;right:10px;top:10px;padding:7px 16px;border-radius:999px;border:0;background:var(--brass);color:#2a1d08;font-weight:800;font-size:13px;cursor:pointer}
  .pgb.wide{display:block;width:100%;margin:6px 0;text-align:left}
  .pgb.danger{border-color:rgba(255,107,94,.5);color:#ffb3ab}
  .sethead{margin:46px 0 6px}.setnote{margin:0 0 14px}
  #settings .pgpanel{margin-top:10px}
  .reduce *,.reduce *::before,.reduce *::after{animation:none!important;transition:none!important}
  /* v8: quick-jump palette */
  .barbtn kbd{margin-left:6px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);font:11px Arial,sans-serif;color:var(--muted)}
  .palette{position:fixed;inset:0;z-index:95;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(3,6,12,.62);backdrop-filter:blur(6px)}
  .pbox{width:min(560px,92vw);border:1px solid var(--line);border-radius:16px;background:rgba(14,21,38,.97);padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:enter .25s ease both}
  .pbox input{width:100%;padding:13px 16px;font-size:17px;letter-spacing:0}
  #pallist{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
  #pallist li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer}
  #pallist li.sel{background:rgba(230,189,92,.16)}
  .pkind{color:var(--muted);font-size:12px;align-self:center}
  .pfoot{margin:10px 2px 0;font-size:12px;color:var(--muted)}
  .mydata{max-width:380px}
  @media (max-width:560px){ol.board li{grid-template-columns:24px 30px 1fr 64px}.brank,.bbar{display:none}}
  @media (max-width:560px){
    .places{grid-template-columns:1fr}.place.home{flex-wrap:wrap}.place.home .pnote{margin-left:0}
    .hero::before{width:80%;left:-30%}
    ol.rules li{font-size:16px}dd{text-align:left}dl.ranks div{flex-direction:column;gap:2px}
  }
  @media (prefers-reduced-motion:reduce){
    #shackle,#sshackle{transition:none}.lockwrap.shake,#inside,#page,#torch.on{animation:none}
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<!-- ===== LOCK SCREEN ===== -->
<div class="screen" id="lockScreen">
<main id="app">
  <div class="lockwrap" id="lockwrap">
    <svg class="lock" viewBox="0 0 160 200" role="img" aria-label="Padlock">
      <defs>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9aa6ba"/><stop offset=".35" stop-color="#eef2f8"/>
          <stop offset=".65" stop-color="#b3bdcd"/><stop offset="1" stop-color="#7d889c"/>
        </linearGradient>
        <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#efcf82"/><stop offset=".45" stop-color="#cfa247"/><stop offset="1" stop-color="#8f6a22"/>
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="halo" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#d9b25a" stop-opacity=".5"/><stop offset="1" stop-color="#d9b25a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle id="glow" cx="80" cy="118" r="96" fill="url(#halo)"/>
      <ellipse cx="80" cy="190" rx="54" ry="7" fill="#000" opacity=".35"/>
      <g id="shackle">
        <path d="M44 100 V62 a36 36 0 0 1 72 0 V100" fill="none" stroke="#4b5568" stroke-width="18" stroke-linecap="round"/>
        <path d="M44 100 V62 a36 36 0 0 1 72 0 V100" fill="none" stroke="url(#steel)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <rect x="20" y="88" width="120" height="96" rx="18" fill="url(#brass)"/>
      <rect x="20" y="88" width="120" height="96" rx="18" fill="url(#sheen)"/>
      <rect x="27" y="95" width="106" height="82" rx="12" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
      <circle cx="35" cy="107" r="2.6" fill="#7a5a1c"/><circle cx="125" cy="107" r="2.6" fill="#7a5a1c"/>
      <circle cx="35" cy="165" r="2.6" fill="#7a5a1c"/><circle cx="125" cy="165" r="2.6" fill="#7a5a1c"/>
      <g id="keyhole" fill="#2a1d08"><circle cx="80" cy="128" r="12"/><path d="M73 134 H87 L91 163 H69 Z"/></g>
    </svg>
  </div>
  <h1 id="title">Site Is Locked</h1>
  <p class="sub" id="sub">Enter the password to continue</p>
  <div class="field">
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <button class="eye" id="eye" type="button" aria-label="Show password">
      <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div class="caps" id="caps" role="status" hidden>Caps Lock is on</div>
  <button class="go" id="go">Unlock</button>
  <div class="pips" id="pips" title="Tries before a lockout"><i></i><i></i><i></i></div>
  <div class="err" id="err" aria-live="polite"></div>
</main>
</div>

<!-- ===== INSIDE ===== -->
<div id="inside" hidden>
</div>

<!-- ===== PLACE LOCK ===== -->
<div class="screen" id="subLock" hidden>
<main id="subapp">
  <div class="lockwrap" id="slockwrap">
    <svg class="slock" viewBox="0 0 160 200" role="img" aria-label="Padlock">
      <defs>
        <linearGradient id="ssteel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9aa6ba"/><stop offset=".35" stop-color="#eef2f8"/>
          <stop offset=".65" stop-color="#b3bdcd"/><stop offset="1" stop-color="#7d889c"/>
        </linearGradient>
        <linearGradient id="sbrass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#efcf82"/><stop offset=".45" stop-color="#cfa247"/><stop offset="1" stop-color="#8f6a22"/>
        </linearGradient>
        <linearGradient id="ssheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="shalo" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#d9b25a" stop-opacity=".5"/><stop offset="1" stop-color="#d9b25a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle id="sglow" cx="80" cy="118" r="96" fill="url(#shalo)"/>
      <ellipse cx="80" cy="190" rx="54" ry="7" fill="#000" opacity=".35"/>
      <g id="sshackle">
        <path d="M44 100 V62 a36 36 0 0 1 72 0 V100" fill="none" stroke="#4b5568" stroke-width="18" stroke-linecap="round"/>
        <path d="M44 100 V62 a36 36 0 0 1 72 0 V100" fill="none" stroke="url(#ssteel)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <rect x="20" y="88" width="120" height="96" rx="18" fill="url(#sbrass)"/>
      <rect x="20" y="88" width="120" height="96" rx="18" fill="url(#ssheen)"/>
      <rect x="27" y="95" width="106" height="82" rx="12" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
      <circle cx="35" cy="107" r="2.6" fill="#7a5a1c"/><circle cx="125" cy="107" r="2.6" fill="#7a5a1c"/>
      <circle cx="35" cy="165" r="2.6" fill="#7a5a1c"/><circle cx="125" cy="165" r="2.6" fill="#7a5a1c"/>
      <g id="skeyhole" fill="#2a1d08"><circle cx="80" cy="128" r="12"/><path d="M73 134 H87 L91 163 H69 Z"/></g>
    </svg>
  </div>
  <h1 id="subTitle">Locked</h1>
  <p class="sub" id="subSub">Enter the password to continue</p>
  <div class="field">
    <input id="subpw" type="password" placeholder="Password" aria-label="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="eye" id="subeye" type="button" aria-label="Show password">
      <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div class="caps" id="subcaps" role="status" hidden>Caps Lock is on</div>
  <button class="go" id="subgo">Unlock</button>
  <div class="pips" id="subpips"><i></i><i></i><i></i></div>
  <button class="relock backbtn" id="subback" type="button">Back</button>
  <div class="err" id="suberr" aria-live="polite"></div>
</main>
</div>

<!-- ===== A PLACE'S PAGE ===== -->
<div id="page" hidden></div>

<header id="bar" hidden>
  <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.9 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/></svg><span id="brandname"></span></span>
  <span class="crumb" id="crumb">Places</span>
  <span class="grow"></span>
  <span class="pill" id="idlepill">Auto-lock 3:00</span>
  <button class="barbtn" id="palbtn" type="button" title="Quick jump (Ctrl+K)">Jump <kbd>Ctrl K</kbd></button>
  <button class="barbtn" type="button" data-act="relock">Lock</button>
</header>
<div class="scenemenu" id="scenemenu" hidden></div>
<button class="fab" id="bgbtn" type="button" aria-label="Choose a background" aria-haspopup="true">Background: Night sky</button>

<div class="palette" id="palette" hidden role="dialog" aria-label="Quick jump">
  <div class="pbox"><input id="palin" placeholder="Jump to anything... try aurora, settings, gao" autocomplete="off" spellcheck="false" aria-label="Search"><ul id="pallist"></ul><p class="pfoot">Up and down to choose · Enter to open · Esc to close</p></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
  // ===== Settings you can change =====
  var MAX_TRIES = 3, LOCK_START_MIN = 5, LOCK_STEP_MIN = 5;   // 3 wrong tries -> 5 min lockout, then +5 each time
  var IDLE_MINUTES = 3, WARN_SECONDS = 30, HIDDEN_LOCK_SECONDS = 60;
  var bgApi = null, UI = { zoom: 1, reduce: false, pill: true };
  try {
    var _s = JSON.parse(localStorage.getItem('revad_sec'));
    if (_s) { MAX_TRIES = _s.tries || MAX_TRIES; LOCK_START_MIN = _s.start || LOCK_START_MIN; if (_s.step !== undefined) LOCK_STEP_MIN = _s.step; IDLE_MINUTES = _s.idle || IDLE_MINUTES; if (_s.hidden !== undefined) HIDDEN_LOCK_SECONDS = _s.hidden; }
    var _u = JSON.parse(localStorage.getItem('revad_ui')); if (_u) { for (var _k in UI) if (_u[_k] !== undefined) UI[_k] = _u[_k]; }
  } catch (e) {}
  function applyUi() { document.documentElement.style.zoom = UI.zoom === 1 ? '' : UI.zoom; document.body.classList.toggle('reduce', !!UI.reduce); }
  applyUi();

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), pw = $('pw'), go = $('go'), err = $('err'), wrap = $('lockwrap'), caps = $('caps');
  var busy = false, inside = false, plain = null, hideTimer = null, idleTimer = null, idleAt = 0, barTimer = null, mainTimer = null;

  /* ---- encryption: every locked area is AES-256-GCM, with the key made from its password ---- */
  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64d(str) { var s = atob(str), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
  async function decryptVault(v, password) {
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(v.salt), iterations: v.it, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(v.iv) }, key, b64d(v.ct)));
  }
  var vault = JSON.parse($('vault').textContent);
  function save(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, String(v)); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* ---- lockouts: same rules for the main lock, every place, and signing in to chat ---- */
  function gUntil(k) { var u = parseInt(load('revad_until_' + k), 10) || 0; return u > Date.now() ? u : 0; }
  function gFail(k) {
    var t = (parseInt(load('revad_tries_' + k), 10) || 0) + 1;
    if (t >= MAX_TRIES) {
      var s = parseInt(load('revad_strikes_' + k), 10) || 0, u = Date.now() + (LOCK_START_MIN + s * LOCK_STEP_MIN) * 60000;
      save('revad_strikes_' + k, s + 1); save('revad_until_' + k, u); save('revad_tries_' + k, null);
      return { until: u, left: 0 };
    }
    save('revad_tries_' + k, t);
    return { until: 0, left: MAX_TRIES - t };
  }
  function gOk(k) { save('revad_tries_' + k, null); save('revad_until_' + k, null); save('revad_strikes_' + k, null); }
  function gDone(k) { save('revad_until_' + k, null); save('revad_tries_' + k, null); }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function triesTxt(n) { return n + (n === 1 ? ' try' : ' tries') + ' left'; }
  function runLock(until, el, setOff, done) {
    setOff(true);
    function tick() {
      var l = until - Date.now();
      if (l <= 0) { clearInterval(id); setOff(false); el.textContent = ''; if (done) done(); return; }
      el.textContent = 'Too many tries. Try again in ' + fmt(l);
    }
    var id = setInterval(tick, 250); tick();
    return id;
  }

  /* ---- main lock ---- */
  function mainOff(off) { pw.disabled = off; go.disabled = off; }
  function mainLocked(until) { clearInterval(mainTimer); mainTimer = runLock(until, err, mainOff, function () { gDone('main'); pips($('pips'), 'main'); pw.focus(); }); }
  function pips(box, key) {
    var t = parseInt(load('revad_tries_' + key), 10) || 0, u = gUntil(key), is = box ? box.children : [];
    for (var i = 0; i < is.length; i++) is[i].classList.toggle('used', !!u || i < t);
  }
  pips($('pips'), 'main');
  if (gUntil('main')) mainLocked(gUntil('main'));
  if (!window.crypto || !crypto.subtle) { err.textContent = 'This browser cannot run the lock.'; mainOff(true); }
  function capsCheck(el, box) { return function (e) { if (e.getModifierState) box.hidden = !e.getModifierState('CapsLock'); }; }
  pw.addEventListener('keydown', capsCheck(pw, caps)); pw.addEventListener('keyup', capsCheck(pw, caps));

  async function tryUnlock() {
    if (busy || pw.disabled) return;
    var attempt = pw.value;
    if (!attempt) { err.textContent = 'Enter the password first'; return; }
    busy = true; go.disabled = true; err.textContent = ''; $('sub').textContent = 'Checking…';
    var html = null;
    try { html = await decryptVault(vault, attempt); } catch (e) { html = null; }
    pw.value = ''; attempt = ''; app.style.setProperty('--k', 0); $('sub').textContent = 'Enter the password to continue';
    if (html !== null) {
      plain = html; gOk('main'); pips($('pips'), 'main');
      app.classList.remove('bad'); app.classList.add('open', 'ok');
      $('title').textContent = 'Unlocked'; $('sub').textContent = 'Welcome in…';
      setTimeout(showInside, 1000);
    } else {
      busy = false; go.disabled = false;
      app.classList.add('bad');
      wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
      setTimeout(function () { app.classList.remove('bad'); }, 900);
      var f = gFail('main'); pips($('pips'), 'main');
      if (f.until) mainLocked(f.until);
      else { err.textContent = 'Wrong password. ' + triesTxt(f.left); pw.focus(); }
    }
  }
  go.addEventListener('click', tryUnlock);
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
  pw.addEventListener('input', function () { err.textContent = ''; app.style.setProperty('--k', Math.min(1, pw.value.length / 12)); });
  $('eye').addEventListener('click', function () { pw.type = pw.type === 'password' ? 'text' : 'password'; pw.focus(); });

  /* ---- top bar, idle timer (kicks you out after IDLE_MINUTES of no activity) ---- */
  var bar = $('bar'), pill = $('idlepill'), crumb = $('crumb');
  function setCrumb(t) { crumb.textContent = t; }
  function relock() { plain = null; location.reload(); }
  function resetIdle() {
    if (!inside) return;
    clearTimeout(idleTimer);
    idleAt = Date.now() + IDLE_MINUTES * 60000;
    idleTimer = setTimeout(relock, IDLE_MINUTES * 60000);
  }
  function setHints() {
    var txt = 'Esc locks instantly. Auto-locks after ' + IDLE_MINUTES + ' minutes of no activity.';
    var hs = document.querySelectorAll('.hint');
    for (var i = 0; i < hs.length; i++) hs[i].textContent = txt;
  }
  function refreshStatus() {
    if ($('inside').hidden) return;
    var t = document.querySelectorAll('#inside .place');
    for (var i = 0; i < t.length; i++) {
      if (!t[i].getAttribute('data-vault')) continue;
      var u = gUntil(t[i].getAttribute('data-key')), n = t[i].querySelector('.pnote');
      var rk = rankIdx(pd(t[i].getAttribute('data-key')).xp);
      var isP = !!t[i].getAttribute('data-person');
      if (n) n.textContent = u ? 'Locked out ' + fmt(u - Date.now()) : (isP ? 'Locked  ·  ' + (rk < 0 ? 'Unranked' : RANKS[rk][0]) : 'Locked. Tap to enter.');
      t[i].classList.toggle('out', !!u);
    }
  }
  function barTick() {
    var l = idleAt - Date.now(), warn = l <= WARN_SECONDS * 1000;
    pill.textContent = (warn ? 'Locking in ' : 'Auto-lock ') + fmt(l);
    pill.classList.toggle('warn', warn); pill.hidden = !UI.pill && !warn;
    refreshStatus();
  }
  function showInside() {
    $('inside').innerHTML = plain;
    $('lockScreen').hidden = true; $('inside').hidden = false; bar.hidden = false;
    document.title = 'REVAD'; $('brandname').textContent = 'REVAD';
    setHints(); hubInfo(); setCrumb('Places'); inside = true; window.scrollTo(0, 0);
    resetIdle(); clearInterval(barTimer); barTimer = setInterval(barTick, 500); barTick();
  }

  /* ---- places ---- */
  var subLock = $('subLock'), subApp = $('subapp'), subpw = $('subpw'), subgo = $('subgo'), suberr = $('suberr');
  var pageBox = $('page'), subTarget = null, subKey = null, subBusy = false, subTimer = null;
  function subOff(off) { subpw.disabled = off; subgo.disabled = off; }
  function subLocked(until) { clearInterval(subTimer); subTimer = runLock(until, suberr, subOff, function () { gDone(subKey); pips($('subpips'), subKey); subpw.focus(); }); }
  function openPlace(btn) {
    if (btn.getAttribute('data-html')) showPage(dec.decode(b64d(btn.getAttribute('data-html'))), btn.getAttribute('data-key'), btn.getAttribute('data-name'));
    else openSubLock(btn);
  }
  function openSubLock(btn) {
    subTarget = btn; subKey = btn.getAttribute('data-key'); subBusy = false;
    $('inside').hidden = true; subApp.classList.remove('sopen', 'sbad');
    subApp.style.setProperty('--accent', btn.getAttribute('data-accent') || '#e6bd5c');
    $('subTitle').textContent = btn.getAttribute('data-name') + ' is locked';
    $('subSub').textContent = 'Enter the password to continue';
    subpw.value = ''; suberr.textContent = ''; subOff(false); clearInterval(subTimer);
    subLock.hidden = false; setCrumb('Places › ' + btn.getAttribute('data-name')); window.scrollTo(0, 0);
    pips($('subpips'), subKey);
    if (gUntil(subKey)) subLocked(gUntil(subKey)); else subpw.focus();
  }
  function closeSubLock() {
    clearInterval(subTimer); subLock.hidden = true; subTarget = null; subpw.value = '';
    $('inside').hidden = false; setCrumb('Places'); window.scrollTo(0, 0);
  }
  function showPage(html, key, name) {
    clearInterval(subTimer); subBusy = false;
    whoNow = null; pageBox.innerHTML = html; setHints(); initChat(); initNotes(key); initPlayground(); initPerson(key); initBoard(); initMembers(); initSettings();
    subLock.hidden = true; $('inside').hidden = true; pageBox.hidden = false;
    setCrumb('Places › ' + name); window.scrollTo(0, 0);
  }
  function goBack() {
    pageBox.innerHTML = ''; pageBox.hidden = true; chatRender = null; if (pgStop) { pgStop(); pgStop = null; }
    $('inside').hidden = false; setCrumb('Places'); hubInfo(); window.scrollTo(0, 0);
  }
  async function trySub() {
    if (subBusy || !subTarget || subpw.disabled) return;
    var attempt = subpw.value.trim();
    if (!attempt) { suberr.textContent = 'Enter the password first'; return; }
    subBusy = true; subgo.disabled = true; suberr.textContent = ''; $('subSub').textContent = 'Checking…';
    var html = null;
    try { html = await decryptVault(JSON.parse(dec.decode(b64d(subTarget.getAttribute('data-vault')))), attempt); } catch (e) { html = null; }
    subpw.value = ''; attempt = ''; $('subSub').textContent = 'Enter the password to continue';
    if (html !== null) {
      gOk(subKey); subApp.classList.add('sopen');
      $('subTitle').textContent = 'Unlocked'; $('subSub').textContent = 'Welcome in…';
      var nm = subTarget.getAttribute('data-name'), k = subKey;
      setTimeout(function () { showPage(html, k, nm); }, 900);
    } else {
      subBusy = false; subgo.disabled = false; subApp.classList.add('sbad');
      var sw = $('slockwrap'); sw.classList.remove('shake'); void sw.offsetWidth; sw.classList.add('shake');
      setTimeout(function () { subApp.classList.remove('sbad'); }, 900);
      var f = gFail(subKey); pips($('subpips'), subKey);
      if (f.until) subLocked(f.until); else { suberr.textContent = 'Wrong password. ' + triesTxt(f.left); subpw.focus(); }
    }
  }

      reset: function () { ST.amount = 1; ST.speed = 1; ST.reach = 170; ST.clicks = true; ST.torch = true; persistSt(); applySt(); for (var i = 0; i < menuRefs.length; i++) menuRefs[i](); seed(); } };
    applySt(); label(); size(); frame();
  })();
</script>
